# PPTX Expert API - Nginx Reverse Proxy Configuration
# 将此配置添加到 /etc/nginx/conf.d/ 目录

server {
    listen 80;
    server_name qingjingxin.org www.qingjingxin.org;

    # API 反向代理
    location /playground/ppt-expert-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 支持大文件上传
        client_max_body_size 50M;
    }

    # OpenAPI JSON 单独路径
    location /playground/ppt-expert-api/openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Content-Type "application/json; charset=utf-8";
    }
}
