# PPTX Expert API - Nginx Reverse Proxy Configuration
# 将此配置复制到 /etc/nginx/conf.d/ppt-expert-api.conf

server {
    listen 80;
    server_name qingjingxin.org www.qingjingxin.org;

    # API 反向代理 - 主路径
    location /playground/ppt-expert-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 支持大文件上传
        client_max_body_size 50M;
    }

    # OpenAPI JSON - 根路径 (用于 Swagger UI)
    # Swagger UI 会请求 /openapi.json，需要单独代理
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 设置正确的 Content-Type
        add_header Content-Type "application/json; charset=utf-8";
    }

    # OpenAPI JSON - 完整路径 (用于 Custom GPT)
    location = /playground/ppt-expert-api/openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        add_header Content-Type "application/json; charset=utf-8";
    }
}
